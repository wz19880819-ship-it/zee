[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superpowers-marketplace"
version = "0.1.0"
description = "A marketplace for discovering and installing Python superpowers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
superpowers = "superpowers_marketplace.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["superpowers_marketplace*"]

[tool.setuptools.package-data]
superpowers_marketplace = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
